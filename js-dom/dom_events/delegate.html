<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event delegate Delegate</title>
</head>
<body>
    <h1>Explore the concept of event delegate</h1>

    <!-- ol#item-list>li.item*6{My awesome Item} -->
     <ol id="item-list">
        <li class="item">My awesome Item</li>
        <li class="item">My awesome Item</li>
        <li class="item">My awesome Item</li>
        <li class="item">My awesome Item</li>
        <li class="item">My awesome Item</li>
        <li class="item">My awesome Item</li>
     </ol>
     <button id="btn-add-item">
        Add new item
     </button>

    <script>
        //const items = document.//getElementsByClassName('item');
        /*console.log(items)*/
        //for(const item of items){
            /*console.log(item)*/
            //item.addEventListener('click',function(){
                /*console.log(event.target.parentNode)*/
              //  event.target.parentNode.removeChild(event.target);
            //})
        //}

        document.getElementById('item-list').addEventListener('click', function(event){
            //console.log(event.target)
            event.target.parentNode.removeChild(event.target);
        })

        //add new item
        document.getElementById('btn-add-item').addEventListener('click', function(){
            //console.log('button clicked')
            //parent node added to
            const ol = document.getElementById('item-list');

            //new item
            const li = document.createElement('li');
            li.classList.add('item')
            li.innerText = 'Brand new item added'

            //add the item
            ol.appendChild(li);
        })
    </script>
</body>
</html>
